<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bosch ワイパー適合検索</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #2B2F36;
  --accent-soft: #5B6270;
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --surface-alt: #F3F3F1;
  --border: #E4E4E1;
  --text: #24262B;
  --muted: #8A8D93;
  --warn-bg: #FBF6E9;
  --warn-border: #E3D8A8;
  --warn-text: #8A6D1D;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Noto Sans JP", sans-serif; min-height: 100vh; }
header { background: var(--surface); padding: 20px 20px 18px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
header h1 { font-family: "Barlow Condensed", sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--text); }
header p { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.container { padding: 28px 16px 60px; max-width: 680px; margin: 0 auto; }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.tab { flex: 1; padding: 12px; text-align: center; font-size: 0.85rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.tab-content { display: none; }
.tab-content.active { display: block; }
label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
select, input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 0.95rem; font-family: "Noto Sans JP", sans-serif; appearance: none; margin-bottom: 16px; transition: border-color 0.2s, box-shadow 0.2s; }
select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(43,47,54,0.08); }
select:disabled { opacity: 0.4; cursor: not-allowed; }
.select-wrap { position: relative; }
.select-wrap::after { content: "▼"; position: absolute; right: 14px; top: 14px; font-size: 0.65rem; color: var(--muted); pointer-events: none; }
.btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 4px; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.03em; font-family: "Noto Sans JP", sans-serif; cursor: pointer; transition: background 0.2s; }
.btn:hover { background: #1a1c21; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.results { margin-top: 28px; }
.result-header { font-size: 0.75rem; color: var(--muted); margin-bottom: 14px; }
.result-header span { color: var(--text); font-weight: 700; font-size: 1rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
.card-title { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
.card-model { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
.card-type { font-size: 0.85rem; color: var(--accent-soft); font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.05em; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.parts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.part-item { background: var(--surface-alt); border-radius: 6px; padding: 10px 12px; }
.part-item.full { grid-column: span 2; }
.part-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.part-value { font-size: 0.95rem; font-weight: 700; font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.05em; color: var(--text); }
.part-value.empty { color: #C4C4C0; font-weight: 400; font-family: "Noto Sans JP", sans-serif; font-size: 0.8rem; }
.warning-box { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 6px; padding: 10px 14px; font-size: 0.85rem; color: var(--warn-text); margin-bottom: 14px; }
.no-result { text-align: center; padding: 40px 20px; color: var(--muted); }
.type-hint { font-size: 0.75rem; color: var(--muted); margin-top: -10px; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="lockScreen" style="position:fixed; inset:0; background:#FAFAF9; z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div style="background:#FFFFFF; border:1px solid #E4E4E1; border-radius:10px; padding:36px 28px; max-width:340px; width:100%; box-shadow:0 4px 14px rgba(0,0,0,0.06); text-align:center;">
    <p style="font-family:'Barlow Condensed', sans-serif; font-size:1.15rem; font-weight:700; color:#24262B; margin-bottom:6px;">パスワードを入力してください</p>
    <p style="font-size:0.75rem; color:#8A8D93; margin-bottom:20px;">社内限定ツールです</p>
    <input id="lockPassInput" type="password" placeholder="パスワード" style="width:100%; padding:12px 14px; border:1px solid #E4E4E1; border-radius:4px; font-size:0.95rem; margin-bottom:12px; font-family:'Noto Sans JP', sans-serif; box-sizing:border-box;">
    <button id="lockPassBtn" style="width:100%; padding:12px; background:#2B2F36; color:#fff; border:none; border-radius:4px; font-size:0.9rem; font-weight:700; cursor:pointer; font-family:'Noto Sans JP', sans-serif;">入る</button>
    <p id="lockPassError" style="font-size:0.78rem; color:#B3261E; margin-top:12px; display:none;">パスワードが違います</p>
  </div>
</div>
<div id="mainContent" style="display:none;">
<header>
  <p>輸入車ワイパーブレード 適合検索</p>
</header>
<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('tab1')">メーカー・車種から探す</div>
    <div class="tab" onclick="switchTab('tab2')">車両型式から探す</div>
  </div>

  <div class="tab-content active" id="tab1">
    <label>メーカー</label>
    <div class="select-wrap">
      <select id="maker-select" onchange="onMakerChange()">
        <option value="">選択してください</option>
      </select>
    </div>
    <label>車種</label>
    <div class="select-wrap">
      <select id="car-select" onchange="onCarChange()" disabled>
        <option value="">先にメーカーを選択</option>
      </select>
    </div>
    <button class="btn" id="btn1" onclick="searchByMakerCar()" disabled>検索する</button>
    <div class="results" id="results1"></div>
  </div>

  <div class="tab-content" id="tab2">
    <label>車両型式</label>
    <input type="text" id="type-input" placeholder="例: DBA-8XCHZ" oninput="onTypeInput()">
    <p class="type-hint">DBA・CBA・ABA・LDA などから始まる型式を入力してください</p>
    <div id="year-wrap" style="display:none">
      <label>年式（任意）</label>
      <div class="select-wrap">
        <select id="year-select">
          <option value="">すべての年式</option>
        </select>
      </div>
    </div>
    <button class="btn" id="btn2" onclick="searchByType()" disabled>検索する</button>
    <div class="results" id="results2"></div>
  </div>
</div>

var makers = [];
(function init() {
  var ms = {};
  DATA.forEach(function(d) { ms[d.maker] = true; });
  makers = Object.keys(ms).sort();
  var sel = document.getElementById("maker-select");
  makers.forEach(function(m) {
    var opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    sel.appendChild(opt);
  });
})();

function switchTab(id) {
  document.querySelectorAll(".tab").forEach(function(t, i) {
    t.classList.toggle("active", (i === 0 ? "tab1" : "tab2") === id);
  });
  document.querySelectorAll(".tab-content").forEach(function(c) {
    c.classList.toggle("active", c.id === id);
  });
}

function onMakerChange() {
  var maker = document.getElementById("maker-select").value;
  var carSel = document.getElementById("car-select");
  carSel.innerHTML = "<option value=''>選択してください</option>";
  carSel.disabled = !maker;
  document.getElementById("btn1").disabled = true;
  document.getElementById("results1").innerHTML = "";
  if (!maker) return;
  var cars = {};
  DATA.filter(function(d) { return d.maker === maker; }).forEach(function(d) { cars[d.car_name] = true; });
  Object.keys(cars).sort().forEach(function(c) {
    var opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    carSel.appendChild(opt);
  });
}

function onCarChange() {
  document.getElementById("btn1").disabled = !document.getElementById("car-select").value;
}

function searchByMakerCar() {
  var maker = document.getElementById("maker-select").value;
  var car = document.getElementById("car-select").value;
  var results = DATA.filter(function(d) { return d.maker === maker && d.car_name === car; });
  renderResults(results, "results1");
}

function onTypeInput() {
  var val = document.getElementById("type-input").value.trim();
  document.getElementById("btn2").disabled = val.length < 3;
  document.getElementById("year-wrap").style.display = "none";
  document.getElementById("results2").innerHTML = "";
  if (val.length < 3) return;
  var matched = DATA.filter(function(d) { return d.type_code && d.type_code.toUpperCase().indexOf(val.toUpperCase()) >= 0; });
  var years = {};
  matched.forEach(function(d) { if (d.year) years[d.year] = true; });
  var yearList = Object.keys(years).sort();
  var yearSel = document.getElementById("year-select");
  yearSel.innerHTML = "<option value=''>すべての年式</option>";
  yearList.forEach(function(y) {
    var opt = document.createElement("option");
    opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  });
  if (yearList.length > 0) document.getElementById("year-wrap").style.display = "block";
}

function searchByType() {
  var val = document.getElementById("type-input").value.trim();
  var year = document.getElementById("year-select").value;
  var results = DATA.filter(function(d) { return d.type_code && d.type_code.toUpperCase().indexOf(val.toUpperCase()) >= 0; });
  if (year) results = results.filter(function(d) { return d.year === year; });
  renderResults(results, "results2");
}

function renderResults(results, containerId) {
  var container = document.getElementById(containerId);
  if (results.length === 0) {
    container.innerHTML = "<div class='no-result'>該当するデータが見つかりませんでした</div>";
    return;
  }
  var isTypeSearch = containerId === "results2";
  var warning = (isTypeSearch && results.length > 1)
    ? "<div class='warning-box'>⚠️ 複数候補がある為、適合確認が必要です。</div>"
    : "";
  var html = "<div class='result-header'><span>" + results.length + "</span> 件見つかりました</div>" + warning;
  results.forEach(function(r) {
    function val(v) { return v ? "<span class='part-value'>" + v + "</span>" : "<span class='part-value empty'>—</span>"; }
    html += "<div class='card'>";
    html += "<div class='card-title'>" + r.maker + " / " + r.car_name + "</div>";
    html += "<div class='card-model'>" + (r.model || "—") + "</div>";
    html += "<div class='card-type'>" + (r.type_code || "") + (r.year ? "　" + r.year : "") + "</div>";
    html += "<div class='parts-grid'>";
    html += "<div class='part-item'><div class='part-label'>汎用 運転席</div>" + val(r.front_driver) + "</div>";
    html += "<div class='part-item'><div class='part-label'>汎用 助手席</div>" + val(r.front_passenger) + "</div>";
    html += "<div class='part-item'><div class='part-label'>車種専用 右ハンドル</div>" + val(r.set_right) + "</div>";
    html += "<div class='part-item'><div class='part-label'>車種専用 左ハンドル</div>" + val(r.set_left) + "</div>";
    html += "<div class='part-item full'><div class='part-label'>リヤ品番</div>" + val(r.rear) + "</div>";
    html += "</div></div>";
  });
  container.innerHTML = html;
}
</script>

  var btn = document.getElementById('lockPassBtn');
  var errorMsg = document.getElementById('lockPassError');

  function tryUnlock() {
    if (input.value === PASSWORD) {
      lockScreen.style.display = 'none';
      mainContent.style.display = 'block';
      try { sessionStorage.setItem('unlocked_boschtool', '1'); } catch (e) {}
    } else {
      errorMsg.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }

  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });

  try {
    if (sessionStorage.getItem('unlocked_boschtool') === '1') {
      lockScreen.style.display = 'none';
      mainContent.style.display = 'block';
    }
  } catch (e) {}
})();
</script>
